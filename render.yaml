databases:
  - name: maritime-db
    plan: free
    region: oregon
    postgresMajorVersion: "15"

services:
  - type: web
    name: maritime-server
    runtime: docker
    region: oregon
    plan: free
    branch: main
    rootDir: server
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: maritime-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: PORT
        value: 4000
      # Full public URL: fromService `host` yields the bare internal hostname,
      # which browsers never send as an Origin.
      - key: CORS_ORIGIN
        value: https://maritime-client.onrender.com

  - type: web
    name: maritime-client
    runtime: docker
    region: oregon
    plan: free
    branch: main
    rootDir: client
    dockerfilePath: ./Dockerfile
    envVars:
      # Baked into the bundle at build time; must be an absolute public URL.
      - key: VITE_API_URL
        value: https://maritime-server.onrender.com
